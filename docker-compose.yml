services:
  payment-api:
    build: ./payment-api-service
    environment:
      PAYMENT_DB_URL: jdbc:postgresql://payments-db:5432/payment_db
      PAYMENT_DB_USERNAME: ${PAYMENT_DB_USERNAME:-user}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-password}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET}
      # JSON logs in containers only. bootRun on your machine keeps the readable
      # console - a human reads dev logs, a log shipper reads these.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs

    ports: [ "8080:8080" ]
    depends_on:
      payments-db: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080'" ]
      interval: 5s
      timeout: 3s
      retries: 20

  ledger:
    build: ./ledger-service
    environment:
      LEDGER_DB_URL: jdbc:postgresql://ledger-db:5432/ledger_db
      LEDGER_DB_USERNAME: ${LEDGER_DB_USERNAME:-user}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:-password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    # No ports. ledger-service has no public API
    depends_on:
      ledger-db: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080'" ]
      interval: 5s
      timeout: 3s
      retries: 20

  payments-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: ${PAYMENT_DB_USERNAME:-user}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:-password}
    ports: ["5432:5432"]
    volumes:
      - payments-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAYMENT_DB_USERNAME:-user} -d payment_db"]
      interval: 2s
      timeout: 3s
      retries: 15

  ledger-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledger_db
      POSTGRES_USER: ${LEDGER_DB_USERNAME:-user}
      POSTGRES_PASSWORD: ${LEDGER_DB_PASSWORD:-password}
    ports: [ "5433:5432" ]
    volumes:
      - ledger-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${LEDGER_DB_USERNAME:-user} -d ledger_db" ]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  kafka:
    # Same image Testcontainers uses, on purpose: a different broker locally and in
    # tests is a classic "works in tests, fails on my machine".
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Three ports, because there are two kinds of client:
      #  29092 - for the services, which run inside this network. Not published.
      #   9092 - for anything on your machine: ./gradlew bootRun, the Kafka CLI.
      #   9093 - the KRaft controller quorum. Kafka 4 has no ZooKeeper, so the broker
      #          runs an internal controller for cluster metadata. Nothing outside the
      #          container ever talks to it, which is why it is not published below.
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093

      # A client's first request is "where do I connect?", and the broker answers with
      # whatever is listed here for the port the client arrived on. The answer has to
      # work from where that client is standing, and "localhost" is a different machine
      # depending on where you ask - inside the network it is the caller's own
      # container. So each entry point gets its own answer, and one address cannot
      # serve both.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports: [ "9092:9092" ]
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      # kafka-topics.sh is a JVM launch, not a 5ms probe like pg_isready, so this
      # needs a longer timeout than the 3s the other services use.
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1" ]
      interval: 2s
      timeout: 10s
      retries: 30

  prometheus:
    image: prom/prometheus:v3.1.0
    # Reaches both services by name on this network, which is why neither needs a
    # published port for scraping. The config is mounted read-only - nothing inside
    # the container has any business rewriting it.
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: [ "9090:9090" ]
    depends_on:
      payment-api: { condition: service_healthy }
      ledger: { condition: service_healthy }

volumes:
  payments-data:
  ledger-data:
  kafkadata:
  prometheus-data:



