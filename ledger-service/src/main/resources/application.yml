spring:
  application:
    name: ledger-service
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  datasource:
    url: ${LEDGER_DB_URL}
    username: ${LEDGER_DB_USERNAME}
    password: ${LEDGER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    # Off by default. The poller runs its SELECT every second whether or not there is
    # anything to send, so leaving this on buries every application log line under
    # thousands of identical queries. Turn it on for one run when you need it:
    #   ./gradlew bootRun --args='--spring.jpa.show-sql=true'
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ledger-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 1000

ledger-events:
  topic: ledger-events
  partitions: 3
  poll-interval: 1s
  batch-size: 100
  send-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        # Defaults to health only. The scrape endpoint has to be named explicitly.
        include: health,info,prometheus
  metrics:
    tags:
      # Stamped on every metric, so one Prometheus query can tell the services apart.
      application: ${spring.application.name}