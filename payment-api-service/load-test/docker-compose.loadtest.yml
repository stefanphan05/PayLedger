# Isolated stack for load testing. Uses non-default ports so it cannot collide
# with the Postgres/Redis you already run for development.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payledger_load
      POSTGRES_USER: payledger
      POSTGRES_PASSWORD: payledger
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payledger -d payledger_load"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
