spring:
  application:
    name: payment-api-service
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  datasource:
    url: ${PAYMENT_DB_URL}
    username: ${PAYMENT_DB_USERNAME}
    password: ${PAYMENT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 1000
    consumer:
      group-id: payment-api-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record

payment-events:
  topic: payment-events
  partitions: 3
  poll-interval: 1s
  batch-size: 100
  send-timeout: 5s

ledger-events:
  topic: ledger-events

idempotency:
  ttl: 24h
  ambiguous-failure-hold: 60s

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000  # 1 hour

management:
  endpoints:
    web:
      exposure:
        # Defaults to health only. The scrape endpoint has to be named explicitly.
        include: health,info,prometheus
  metrics:
    tags:
      # Stamped on every metric, so one Prometheus query can tell the services apart.
      application: ${spring.application.name}